[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smolvla-libero-experiments"
version = "0.1.0"
description = "Local SmolVLA fine-tuning and LIBERO-Spatial evaluation"
requires-python = ">=3.12"
dependencies = [
  "lerobot[smolvla,libero]", "numpy", "pyarrow", "matplotlib", "av", "pillow",
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
include = ["smolvla_experiment*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["lerobot", "experiments", "resources"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
